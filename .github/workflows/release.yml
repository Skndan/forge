# Forge Release Workflow
# On tag v* — build, publish Docker images, create GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  BUN_VERSION: "1.1.0"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: cd packages/types && bun run build
      - run: bun run test

  docker:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - realtime
          - function-runner
          - worker-webhook
          - worker-scheduler
          - worker-audit
          - dashboard
      fail-fast: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate changelog
        id: changelog
        run: |
          echo "### 🚀 Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "See [CHANGELOG.md](./CHANGELOG.md) for details." >> release-notes.md
          echo "" >> release-notes.md
          echo "### 📦 Docker Images" >> release-notes.md
          echo "" >> release-notes.md
          for service in gateway realtime function-runner worker-webhook worker-scheduler worker-audit dashboard; do
            echo "- \`ghcr.io/\${{ github.repository }}/\$service:${{ github.ref_name }}\`" >> release-notes.md
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
