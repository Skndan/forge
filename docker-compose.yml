# Forge — Docker Compose Stack
# v0.5 — DX & Polish (Monitoring Edition)

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-monitoring: &monitoring-label
  monitoring: "prometheus"

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── Keycloak ───────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: forge-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/forge
      KC_DB_USERNAME: forge
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?err}
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?err}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./packages/auth/keycloak:/opt/keycloak/data/import:ro
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | head -n 1 | grep -q 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ── Gateway (Bun + Fastify) ────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    container_name: forge-gateway
    environment:
      NODE_ENV: production
      SERVICE_NAME: forge-gateway
      JSON_LOGS: "true"
      PORT: 3000
      POSTGRES_URL: postgres://forge:${POSTGRES_PASSWORD:?err}@postgres:5432/forge
      JWKS_URL: ${JWKS_URL:-http://keycloak:8080/realms/forge/protocol/openid-connect/certs}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/forge}
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?err}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RUSTFS_URL: http://rustfs:9000
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── Realtime (WebSocket) ───────────────────────────────────────
  realtime:
    build:
      context: .
      dockerfile: packages/realtime/Dockerfile
    container_name: forge-realtime
    environment:
      SERVICE_NAME: forge-realtime
      JSON_LOGS: "true"
      PORT: 3001
      POSTGRES_URL: postgres://forge:${POSTGRES_PASSWORD:?err}@postgres:5432/forge
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      JWKS_URL: ${JWKS_URL:-http://keycloak:8080/realms/forge/protocol/openid-connect/certs}
    ports:
      - "${REALTIME_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── Function Runner (Bun + DinD) ────────────────────────────────
  function-runner:
    build:
      context: .
      dockerfile: packages/function-runner/Dockerfile
    container_name: forge-function-runner
    privileged: true
    environment:
      SERVICE_NAME: forge-function-runner
      JSON_LOGS: "true"
      PORT: 3002
      POSTGRES_URL: postgres://forge:${POSTGRES_PASSWORD:?err}@postgres:5432/forge
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      DOCKER_HOST: tcp://localhost:2375
      FN_DEFAULT_TIMEOUT_MS: 30000
      FN_MAX_TIMEOUT_MS: 300000
      FN_MAX_MEMORY_MB: 512
      FN_MAX_CPU_SHARES: 512
      FN_MAX_SOURCE_SIZE: 10485760
      FN_WARM_POOL_MAX_PER_TENANT: 10
      FN_WARM_POOL_REBALANCE_MS: 30000
      FN_WARM_POOL_IDLE_MS: 300000
      FN_JWT_SECRET: ${FN_JWT_SECRET:-forge-fn-jwt-dev-secret}
      FN_JWT_ISSUER: forge-function-runner
      FN_JWT_AUDIENCE: forge-function
      FN_LOG_RETENTION_DAYS: 30
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?err}
      FORGE_SANDBOX_MODE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${FUNCTION_RUNNER_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── Webhook Worker (Bun) ───────────────────────────────────────
  worker-webhook:
    build:
      context: .
      dockerfile: packages/worker-webhook/Dockerfile
    container_name: forge-worker-webhook
    environment:
      SERVICE_NAME: forge-worker-webhook
      JSON_LOGS: "true"
      POSTGRES_URL: postgres://forge:${POSTGRES_PASSWORD:?err}@postgres:5432/forge
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── Scheduler Worker (Bun) ─────────────────────────────────────
  worker-scheduler:
    build:
      context: .
      dockerfile: packages/worker-scheduler/Dockerfile
    container_name: forge-worker-scheduler
    environment:
      SERVICE_NAME: forge-worker-scheduler
      JSON_LOGS: "true"
      POSTGRES_URL: postgres://forge:${POSTGRES_PASSWORD:?err}@postgres:5432/forge
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── Audit Logger Worker (Bun) ──────────────────────────────────
  worker-audit:
    build:
      context: .
      dockerfile: packages/worker-audit/Dockerfile
    container_name: forge-worker-audit
    environment:
      SERVICE_NAME: forge-worker-audit
      JSON_LOGS: "true"
      POSTGRES_URL: postgres://forge:${POSTGRES_PASSWORD:?err}@postgres:5432/forge
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── RustFS (S3-compatible storage) ─────────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: forge-rustfs
    environment:
      RUSTFS_DATA_DIR: /data
      RUSTFS_BIND: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?err}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?err}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BROWSER: "on"
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  # ── Valkey (Redis-compatible, for pub/sub + caching) ───────────
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: forge-valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
    labels: *monitoring-label

  # ── Admin Dashboard (Next.js) ──────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: forge-dashboard
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: ${GATEWAY_URL:-http://localhost:3000}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: forge
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: forge-dashboard
    ports:
      - "${DASHBOARD_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - gateway
    logging: *default-logging
    restart: unless-stopped

  # ── Monitoring: Prometheus ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: forge-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - gateway
      - realtime
    logging: *default-logging
    restart: unless-stopped

  # ── Monitoring: Grafana ────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.0
    container_name: forge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3004}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - prometheus
    logging: *default-logging
    restart: unless-stopped

  # ── Monitoring: PostgreSQL Exporter ────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: forge-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://forge:${POSTGRES_PASSWORD:?err}@postgres:5432/forge?sslmode=disable"
    ports:
      - "${PG_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ── Monitoring: Valkey Exporter ────────────────────────────────
  valkey-exporter:
    image: oliver006/redis_exporter:v1.58.0-alpine
    container_name: forge-valkey-exporter
    environment:
      REDIS_ADDR: redis://valkey:6379
    ports:
      - "${VALKEY_EXPORTER_PORT:-9121}:9121"
    depends_on:
      valkey:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
  rustfs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
